@if (showChrome()) {
  <header class="chrome">
    <a class="wordmark" routerLink="/dashboard">CERTIFLOW</a>

    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      @if (auth.canUpload()) {
        <a routerLink="/upload" routerLinkActive="active">Upload</a>
      }
      @if (auth.canReview()) {
        <a routerLink="/review" routerLinkActive="active">Review queue</a>
      }
      @if (auth.canAudit()) {
        <a routerLink="/audit" routerLinkActive="active">Audit trail</a>
      }
      <a routerLink="/inbox" routerLinkActive="active">Notifications</a>
      @if (auth.canAdminister()) {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
    </nav>

    <div class="who">
      <span class="name">{{ auth.displayName() }}</span>
      <span class="role">{{ auth.role() }}</span>
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>
}

<router-outlet />
