name: Deploy

# Manual only, deliberately.
#
# SRS §5.0: the environment is provisioned for recording sessions and torn down afterwards, and R9
# names the realistic failure as "teardown discipline fails and the environment quietly stays up,
# billing". Deploying on every push to main would mean every merge silently starts a meter.
on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Short environment suffix
        required: true
        default: dev
      imageTag:
        description: Image tag to deploy (defaults to the commit sha)
        required: false
        default: ''

permissions:
  id-token: write   # OIDC federated credential - no client secret exists to leak (NFR-9)
  contents: read

concurrency:
  # Two deployments applying migrations to one database at the same time is the failure this
  # prevents. Never cancel in progress: a half-applied deployment is worse than a queued one.
  group: deploy-${{ github.event.inputs.environmentName }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-certiflow-${{ github.event.inputs.environmentName }}
  LOCATION: swedencentral
  OPENAI_ACCOUNT: certiflow-openai-zk
  # The group the OpenAI account already lives in. It must NOT be the environment's group: the
  # environment group is deleted wholesale at teardown, and the account holds a model deployment
  # that costs time and quota to recreate (see infra/modules/openai-access.bicep). The guard below
  # enforces that rather than trusting whoever types the environment name.
  OPENAI_RESOURCE_GROUP: rg-certiflow-dev

jobs:
  infrastructure:
    name: Provision
    runs-on: ubuntu-latest
    outputs:
      registryLoginServer: ${{ steps.deploy.outputs.registryLoginServer }}
      gatewayUrl: ${{ steps.deploy.outputs.gatewayUrl }}
      sqlServerName: ${{ steps.deploy.outputs.sqlServerName }}
      imageTag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=${{ github.event.inputs.imageTag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse to deploy on top of the OpenAI account
        run: |
          set -euo pipefail
          if [ "$RESOURCE_GROUP" = "$OPENAI_RESOURCE_GROUP" ]; then
            echo "::error::Environment '${{ github.event.inputs.environmentName }}' resolves to $RESOURCE_GROUP, which holds the Azure OpenAI account."
            echo "::error::Teardown deletes the environment's resource group wholesale, so this would put the account in its blast radius. Pick another environment name."
            exit 1
          fi
          echo "$RESOURCE_GROUP is separate from $OPENAI_RESOURCE_GROUP"

      - name: Create resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --tags application=certiflow managedBy=bicep --output none

      # Runs before the images exist, and that is fine: Container Apps will fail to pull on the
      # first revision and succeed once the images are pushed and the apps are updated below. The
      # alternative - building images before the registry exists - has a worse chicken-and-egg
      # problem, because the registry is the thing being provisioned.
      - id: deploy
        name: Deploy Bicep
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              environmentName='${{ github.event.inputs.environmentName }}' \
              openAiAccountName="$OPENAI_ACCOUNT" \
              openAiResourceGroup="$OPENAI_RESOURCE_GROUP" \
              sqlAdminObjectId='${{ secrets.AZURE_SQL_ADMIN_OBJECT_ID }}' \
              sqlAdminLogin='${{ secrets.AZURE_SQL_ADMIN_LOGIN }}' \
              imageTag='${{ steps.tag.outputs.value }}' \
            --query properties.outputs \
            --output json > outputs.json

          for key in registryLoginServer gatewayUrl sqlServerName; do
            echo "$key=$(jq -r ".$key.value" outputs.json)" >> "$GITHUB_OUTPUT"
          done

  images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: infrastructure
    strategy:
      # One failing image should not hide the other seven. A partial push is recoverable; a run
      # that stopped at the first error tells you least when you most want to know.
      fail-fast: false
      matrix:
        include:
          - { image: gateway,      project: src/gateway/Certiflow.Gateway,                                    dll: Certiflow.Gateway.dll }
          - { image: registry,     project: src/services/supplier-registry/Certiflow.SupplierRegistry.Api,    dll: Certiflow.SupplierRegistry.Api.dll }
          - { image: intake,       project: src/services/document-intake/Certiflow.Intake.Api,                dll: Certiflow.Intake.Api.dll }
          - { image: verification, project: src/services/verification/Certiflow.Verification.Api,             dll: Certiflow.Verification.Api.dll }
          - { image: compliance,   project: src/services/compliance/Certiflow.Compliance.Api,                 dll: Certiflow.Compliance.Api.dll }
          - { image: audit,        project: src/services/audit-trail/Certiflow.Audit.Api,                     dll: Certiflow.Audit.Api.dll }
          - { image: reporting,    project: src/services/reporting/Certiflow.Reporting.Api,                   dll: Certiflow.Reporting.Api.dll }
          - { image: worker,       project: src/services/document-intelligence/Certiflow.Intelligence.Worker, dll: Certiflow.Intelligence.Worker.dll }
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        # az acr login mints a short-lived token from the federated identity. No registry password
        # is created, stored or passed anywhere.
        run: az acr login --name "$(echo '${{ needs.infrastructure.outputs.registryLoginServer }}' | cut -d. -f1)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PROJECT=${{ matrix.project }}
            ENTRY_DLL=${{ matrix.dll }}
          tags: |
            ${{ needs.infrastructure.outputs.registryLoginServer }}/certiflow-${{ matrix.image }}:${{ needs.infrastructure.outputs.imageTag }}
            ${{ needs.infrastructure.outputs.registryLoginServer }}/certiflow-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    needs: [infrastructure, images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: dotnet tool install --global dotnet-ef --version 9.0.19

      # Migrations run HERE, once, and never inside a service.
      #
      # Container Apps runs up to two replicas of each service; two replicas applying the same
      # migration concurrently is how a deployment corrupts a schema. Doing it as a deploy step also
      # means a migration failure stops the deployment instead of producing a container that crash-
      # loops with a schema error (NFR-19).
      #
      # --idempotent so re-running a deployment is safe: the script checks the history table before
      # each migration rather than assuming it knows what is applied.
      - name: Apply every context's migrations
        env:
          SQL_SERVER: ${{ needs.infrastructure.outputs.sqlServerName }}
        run: |
          set -euo pipefail
          CONNECTION="Server=tcp:${SQL_SERVER}.database.windows.net,1433;Database=certiflow;Authentication=Active Directory Default;Encrypt=True;"

          declare -a CONTEXTS=(
            "supplier-registry|Certiflow.SupplierRegistry|RegistryDbContext|Api"
            "document-intake|Certiflow.Intake|IntakeDbContext|Api"
            "document-intelligence|Certiflow.Intelligence|IntelligenceDbContext|Worker"
            "verification|Certiflow.Verification|VerificationDbContext|Api"
            "compliance|Certiflow.Compliance|ComplianceDbContext|Api"
            "audit-trail|Certiflow.Audit|AuditDbContext|Api"
            "reporting|Certiflow.Reporting|ReportingDbContext|Api"
          )

          for entry in "${CONTEXTS[@]}"; do
            IFS='|' read -r folder prefix context startup <<< "$entry"
            echo "::group::$context"
            dotnet ef database update \
              --project "src/services/$folder/$prefix.Infrastructure" \
              --startup-project "src/services/$folder/$prefix.$startup" \
              --context "$context" \
              --connection "$CONNECTION"
            echo "::endgroup::"
          done

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [infrastructure, images, migrate]
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Every service scales to zero, so the first request pays a cold start. This both proves the
      # deployment works and warms the gateway, which is what §20 R8 asks for instead of paying for
      # a minimum replica around the clock.
      - name: Wait for the gateway
        run: |
          set -euo pipefail
          URL='${{ needs.infrastructure.outputs.gatewayUrl }}'
          echo "Gateway: $URL"

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 10
          done

          echo "::error::The gateway never became healthy."
          exit 1

      - name: Verify the issuer is serving discovery
        run: |
          set -euo pipefail
          URL='${{ needs.infrastructure.outputs.gatewayUrl }}'
          # If this fails, every service will fail to validate tokens - and it fails as a confusing
          # 401 rather than an obvious configuration error, so it is worth asserting here.
          curl -sf --max-time 20 "$URL/.well-known/openid-configuration" | jq -e '.jwks_uri' > /dev/null
          echo "discovery document ok"

      - name: Summary
        run: |
          {
            echo "### Certiflow deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Gateway | ${{ needs.infrastructure.outputs.gatewayUrl }} |"
            echo "| Image tag | \`${{ needs.infrastructure.outputs.imageTag }}\` |"
            echo "| Resource group | \`$RESOURCE_GROUP\` |"
            echo ""
            echo "**Tear it down when the recording is finished:** \`bash scripts/teardown.sh ${{ github.event.inputs.environmentName }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
